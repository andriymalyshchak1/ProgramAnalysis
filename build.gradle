plugins {
    id 'java'
    id 'antlr'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Without this line the antlr plugin quietly falls back to ANTLR 2.
    // 4.13.0 matches the jar from the course starter kit.
    antlr 'org.antlr:antlr4:4.13.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Grammars live in src/main/antlr; the generated lexer/parser/visitor are
// written to build/generated-src and compiled with the rest of the code.
generateGrammarSource {
    arguments += ['-visitor', '-no-listener']
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

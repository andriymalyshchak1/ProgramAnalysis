plugins {
    id 'java'
    id 'antlr'
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // ./gradlew -q run --args="--run examples/Adults.jlinq"
    mainClass = 'linqc.Main'
    applicationName = 'linqc'
}

dependencies {
    // Without this line the antlr plugin quietly falls back to ANTLR 2.
    // 4.13.0 matches the jar from the course starter kit.
    antlr 'org.antlr:antlr4:4.13.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Grammars live in src/main/antlr; the generated lexer/parser/visitor are
// written to build/generated-src and compiled with the rest of the code.
generateGrammarSource {
    // JLinqParser reads its token types from the JLinqLexer.tokens file that the
    // lexer generates, so -lib points ANTLR at the folder where that file lands.
    def generatedParserDir = layout.buildDirectory.dir('generated-src/antlr/main/linqc/parser').get().asFile
    arguments += ['-visitor', '-no-listener', '-lib', generatedParserDir.path]
    doFirst { generatedParserDir.mkdirs() } // ANTLR rejects a -lib folder that doesn't exist yet
}

test {
    useJUnitPlatform()
    inputs.dir('examples') // ExamplesTest reads these, so editing one should rerun the tests
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
